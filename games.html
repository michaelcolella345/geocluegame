  <meta name="theme-color" content="#e8f0ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c1a24" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.ico" sizes="32x32">

<body>
  <div class="wrap">

            <li><a href="games.html" aria-current="page">More games</a></li>
          </ul>
        </nav>

    </header>

    <main class="card notice soon">
      <p class="globe" aria-hidden="true">🌍</p>
      <h2>More games coming soon</h2>
      <p>We're building new daily puzzles to play alongside GeoClue. Check back soon!</p>
      <p><a class="button" href="./">Play today's GeoClue</a></p>

    <footer>GeoClue: a new geography puzzle every day.</footer>
  </div>
